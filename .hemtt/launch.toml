[default]
workshop = [
    "450814997",  # CBA_A3
    "463939057",  # ACE3
    "1779063631", # Zeus Enhanced
    "3499977893", # Advanced Developer Tools
]
# Test mission with the vanilla objects the addons add functions to, in .hemtt/missions/
mission = "test.VR"

# Launched with `hemtt launch acre` / `hemtt launch bwa3` / `hemtt launch gm`
[acre]
extends = "default"
workshop = [
    "751965892",  # ACRE2
]

[bwa3]
extends = "default"
workshop = [
    "1200127537", # BWMod
]

# Global Mobilization with ACRE, opens the GM test mission
[gm]
extends = "acre"
dlc = [
    "gm",
]
mission = "gm.VR"

[tfar]
extends = "default"
workshop = [
    "894678801", # Task Force Arrowhead Radio
]
